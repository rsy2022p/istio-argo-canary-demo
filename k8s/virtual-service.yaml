apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: product
  namespace: canary-demo
spec:
  hosts:
    - product.canary-demo.example.com
  gateways:
    - product-gateway
  http:
    - name: primary
      route:
        - destination:
            host: product-stable.canary-demo.svc.cluster.local
            port:
              number: 80
          weight: 100
        - destination:
            host: product-canary.canary-demo.svc.cluster.local
            port:
              number: 80
          weight: 0