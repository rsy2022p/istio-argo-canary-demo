apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: product-canary
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/rsy2022p/istio-argo-canary-demo.git
    targetRevision: main
    path: k8s

  destination:
    server: https://kubernetes.default.svc
    namespace: canary-demo

  syncPolicy:
    syncOptions:
      - CreateNamespace=false
